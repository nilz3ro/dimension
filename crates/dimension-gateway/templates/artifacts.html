<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Artifacts -- Session {{ session_id }}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 0.5rem 1rem; border-bottom: 1px solid #ddd; text-align: left; }
    th { background: #f5f5f5; }
    a { color: #0070f3; }
    .empty { color: #888; padding: 2rem 0; text-align: center; }
  </style>
</head>
<body>
  <h1>Artifacts</h1>
  <p>Session: <code>{{ session_id }}</code></p>
  {% if artifacts.is_empty() %}
    <p class="empty">No artifacts in this session.</p>
  {% else %}
  <table>
    <thead><tr><th>Name</th><th>Size</th><th>Type</th><th>Created</th><th></th></tr></thead>
    <tbody>
    {% for item in artifacts %}
      <tr>
        <td>{{ item.display_name }}</td>
        <td>{{ item.size_human }}</td>
        <td>{{ item.content_type }}</td>
        <td>{{ item.created_at }}</td>
        <td><a href="{{ item.presigned_url }}">Download</a></td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
  {% endif %}
</body>
</html>
